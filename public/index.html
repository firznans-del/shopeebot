<!DOCTYPE html>
<html>
<head>
    <title>Shopee Bot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #FF6B35;
            margin-bottom: 20px;
        }
        .btn {
            background: #FF6B35;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        .btn:hover {
            background: #E55A2B;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Shopee Bot Ready!</h1>
        <p>Deploy successful to Vercel</p>
        <button class="btn" onclick="testAPI()">Test API</button>
        <div id="result"></div>
    </div>
    
    <script>
        async function testAPI() {
            const result = document.getElementById('result');
            result.innerHTML = '<p>Testing API...</p>';
            
            try {
                const response = await fetch('/api/check');
                const data = await response.json();
                result.innerHTML = `<p>✅ API Response: ${data.status}</p>`;
            } catch (error) {
                result.innerHTML = `<p>❌ Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
